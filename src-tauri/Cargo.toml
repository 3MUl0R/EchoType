[package]
name = "echotype"
version = "0.1.0"
edition = "2021"
description = "Local-first dictation for your desktop"
license = "MIT"
rust-version = "1.77"

[lib]
name = "echotype_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "test"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive"] }
dirs = "6"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "sync", "macros"] }
thiserror = "2"

# Audio
cpal = "0.17"
rodio = "0.22"
rubato = "0.16"
nnnoiseless = "0.5"
hound = "3.5"

# STT
whisper-rs = { version = "0.15", features = ["tracing_backend"] }

# Global hotkey
tauri-plugin-global-shortcut = "2"

# Text insertion
enigo = "0.3"
arboard = { version = "3", features = ["wayland-data-control"] }

# Model downloads
reqwest = { version = "0.13", features = ["stream", "rustls", "multipart"], default-features = false }
sha2 = "0.10"
futures-util = "0.3"

# Secure key storage
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }

# Database
rusqlite = { version = "0.34", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }

# Fuzzy text matching (custom vocabulary)
strsim = "0.11"
natural = "0.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
